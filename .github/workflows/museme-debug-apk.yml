name: Build Museme debug APK



on:

  workflow_dispatch:
  
  push:
  
    branches:
    
      - main
      


permissions:

  contents: read
  


jobs:

  build-debug-apk:
  
    name: Assemble Android debug APK
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 45
    


    steps:
    
      - name: Check out build files
      
        uses: actions/checkout@v5
        


      - name: Unpack Museme source
      
        run: unzip -q museme-source-track-sync-compact.zip -d app
        


      - name: Configure room server endpoint
      
        working-directory: app
        
        run: |
        
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          
          printf 'MUSEME_ROOM_SERVER_URL=https://museme-room-server.onrender.com\n' >> local.properties
          


      - name: Set up JDK 21
      
        uses: actions/setup-java@v5
        
        with:
        
          java-version: '21'
          
          distribution: temurin
          


      - name: Make Gradle wrapper executable
      
        working-directory: app
        
        run: chmod +x ./gradlew
        


      - name: Build Museme debug APK
      
        working-directory: app
        
        run: ./gradlew :androidApp:assembleDebug
        


      - name: Upload Museme APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: museme-debug-apk-online
          
          path: app/androidApp/build/outputs/apk/debug/*.apk
          
          if-no-files-found: error
          
          retention-days: 14
          





































