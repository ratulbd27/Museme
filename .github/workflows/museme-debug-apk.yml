name: Build Museme debug APK



on:

  workflow_dispatch:
  
  push:
  
    branches:
    
      - main
      


permissions:

  contents: read
  


jobs:

  build-debug-apk:
  
    name: Assemble Android debug APK
    
    runs-on: ubuntu-latest
    
    timeout-minutes: 45
    


    steps:
    
      - name: Check out build files
      
        uses: actions/checkout@v5
        


      - name: Unpack Museme source
      
        run: unzip -q museme-source.zip -d app
        


      - name: Set up JDK 21
      
        uses: actions/setup-java@v5
        
        with:
        
          java-version: '21'
          
          distribution: temurin
          


      - name: Make Gradle wrapper executable
      
        working-directory: app
        
        run: chmod +x ./gradlew
        


      - name: Build Museme debug APK
      
        working-directory: app
        
        run: >-
        
          ./gradlew :androidApp:assembleDebug
          
          --no-daemon
          
          --no-configuration-cache
          
          --max-workers=2
          
          -Pkotlin.compiler.execution.strategy=in-process
          
          -Pkotlin.daemon.enabled=false
          


      - name: Upload Museme APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: museme-debug-apk
          
          path: app/androidApp/build/outputs/apk/debug/*.apk
          
          if-no-files-found: error
          
          retention-days: 14
          






































